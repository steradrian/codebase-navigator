services:
  postgres:
    image: postgres:16-alpine
    container_name: graph-explorer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: graph_explorer
      POSTGRES_PASSWORD: graph_explorer
      POSTGRES_DB: graph_explorer
    ports:
      # 5432 was already bound on the host; using 5433 externally.
      # If you need 5432, stop the other Postgres and change this back.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph_explorer -d graph_explorer"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
